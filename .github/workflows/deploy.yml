name: Build and Push Docker Images

on:
  push:
    branches:
      - develop

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Cache Maven dependencies
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2

      # 4. Build project (includes common module)
      - name: Build ecom and auth modules
        run: mvn clean package -pl ecom,auth -am -DskipTests

      # 5. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 6. Build and push ecom Docker image
      - name: Build and push ecom image
        run: |
          docker build -f ecom/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/ecom-service:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/ecom-service:latest

      # 7. Build and push auth Docker image
      - name: Build and push auth image
        run: |
          docker build -f auth/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/auth-service:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/auth-service:latest