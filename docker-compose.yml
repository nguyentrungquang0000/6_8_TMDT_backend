services:
  minio:
    container_name: minio_chat_0703
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - cron_minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped
  redis:
    image: redis:latest
    container_name: redis-server
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: [ "redis-server", "--appendonly", "yes" ]

volumes:
  cron_minio_data:
  redis_data: