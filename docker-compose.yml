services:
  minio:
    container_name: minio_chat_0703
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - cron_minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped
  redis:
    image: redis:latest
    container_name: redis-server
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: [ "redis-server", "--appendonly", "yes" ]

  postgres:
    image: postgres:17.3
    restart: always
    container_name: tmdt_postgres
    environment:
      POSTGRES_DB: tmdt_db
      POSTGRES_PASSWORD: 123
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  cron_minio_data:
  redis_data:
  postgres_data: